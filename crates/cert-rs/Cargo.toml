[package]
name = "cert-rs"
version = "0.0.0"
# description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["proxy-manager"]

# [[example]]
# name = "pebble-test"
# path = "examples/pebble-test/src/main.rs"
# test = true

# [[test]]
# name = "pebble"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# lib-proxy = { path = "../../libs/lib-proxy" }

tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "time",
] }
url = { version = "2", features = ["serde"] }
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
openssl = { version = "0.10", features = ["vendored"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3" }

strum = "0.28"
strum_macros = "0.28"

thiserror = "2"
color-eyre = "0.6"

tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }

base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
color-eyre = "0.6"
serial_test = "*"
fake = { version = "4" }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
