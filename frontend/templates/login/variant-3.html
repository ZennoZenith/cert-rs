<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Sign in to your account</title>
    <link rel="stylesheet" href="/static/css/build/tailwind.css">

    <script src="/static/js/initialThemeLoad.js"></script>
    <script
      src="/static/js/build/routes/login/login.js"
      type="module"
    ></script>

    <style>
    @import url("/static/css/build/tailwind.css");
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

    html {
      /* font-family: "IBM Plex Sans", Poppins, Segoe UI, sans-serif; */
      font-family: Poppins, Segoe UI, sans-serif;
      font-size: 12pt;
      color: var(--text-color);
      text-align: center;
    }

    body {
      background-image: url(/static/images/pexels-anniroenkae-low.jpg);
      background-size: cover;
      background-position: right;
      overflow: hidden;
    }

    div:has(input:focus) > label {
      background-color: var(--color-base-content);
    }

    form div.incorrect label {
      background-color: #f06272;
    }
    form div.incorrect input {
      border-color: #f06272;
    }
    #error-message {
      color: #f06272;
    }
    </style>
  </head>
  <body class="min-h-dvh">
    <div class="relative box-border bg-base-200 text-base-content min-h-dvh w-[min(100%,600px)] p-4 flex flex-col items-center justify-center rounded-none lg:rounded-r-3xl lg:w-[max(40%,600px)]">
      <theme-toggle class="absolute right-4 top-4">
        <input
          type="checkbox"
          data-theme-toggle
          class="hidden toggle border-orange-500 bg-orange-400 checked:border-secondary checked:bg-neutral"
        >
      </theme-toggle>
      <h1 class="text-5xl font-extrabold uppercase">
        Sign in
      </h1>
      <p id="error-message"></p>
      <login-form>
        <form
          id="form"
          class="w-[min(400px,100%)] mt-5 mb-12 flex flex-col items-center gap-2"
        >
          <div class="incorrect w-full flex justify-center">
            <label
              for="email-input"
              class="shrink-0 h-12 w-12 bg-accent fill-base-200 text-base-200 rounded-l-xl flex justify-center items-center text-2xl font-medium"
            >
              <span>@</span>
            </label>
            <input
              type="email"
              placeholder="john.doe@example.com"
              name="email"
              aria-invalid="true"
              value="demo1@example.com"
              required
              class="box-border grow min-w-0 h-12 p-4 font[inherit] rounded-r-xl border-2 border-l-0 border-solid border-primary bg-primary transition-[transform,background-color] hover:border-accent focus:outline-none focus:border-base-content placeholder:text-base-content"
            >
          </div>
          <div class="w-full flex justify-center">
            <label
              for="password-input"
              class="shrink-0 h-12 w-12 bg-accent fill-base-200 text-base-200 rounded-l-xl flex justify-center items-center text-2xl font-medium"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24"
                viewBox="0 -960 960 960"
                width="24"
              >
                <path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z" />
              </svg>
            </label>
            <custom-password showpassword>
              <input
                type="password"
                name="password"
                aria-invalid="false"
                value="welcome"
                required
                class="box-border grow min-w-0 h-12 p-4 font[inherit] rounded-r-xl border-2 border-l-0 border-solid border-primary bg-primary transition-[transform,background-color] hover:border-accent focus:outline-none focus:border-base-content placeholder:text-base-content"
              >
            </custom-password>
          </div>
          <p class="text-xs leading-relaxed opacity-60">
            Hold <code class="text-xs font-bold">Ctrl</code> to display your
            password temporarily.
          </p>
          <button
            type="submit"
            class="mt-2 border-none rounded-full py-3.5 px-16 bg-accent text-base-content font[inherit] cursor-pointer uppercase transition-[transform,background-color] hover:text-base-content focus:outline-none focus:bg-base-content"
          >
            Sign in
          </button>
        </form>
      </login-form>
      <p>
        Don't have an account? <a
          href="/register/variant/3"
          class="no-underline text-accent hover:underline"
        >Create one now</a>
      </p>
    </div>
    {% include "fragmants/defaultTemplates.html" %}
  </body>
</html>
