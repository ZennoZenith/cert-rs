[workspace]
members = ["crates/cert-rs", "crates/cert-rs-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
description = ""
authors = ["Zenno Zenith <95485961+ZennoZenith@users.noreply.github.com>"]
license = "GNU AGPLv3"
edition = "2024"
repository = "https://github.com/ZennoZenith/cert-rs"
keywords = ["ssl", "letsencrypt", "acme"]

[workspace.lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

# [profile.release]
# lto = true
# codegen-units = 1
# panic = "abort"
# strip = true

[workspace.dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "time",
] }
url = { version = "2", features = ["serde"] }
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
