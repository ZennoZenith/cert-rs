[workspace.lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

[workspace]
resolver = "2"
members = [
  # -- Application Libraries
  "crates/libs/lib-auth",
  "crates/libs/lib-core",
  "crates/libs/lib-utils",
  "crates/libs/lib-web",
  "crates/libs/lib-hotreload",
  # -- Application Services
  "crates/services/web-server",
  # -- Tools
  "crates/tools/gen-key",
  "crates/tools/gen-pass",
]

[workspace.dependencies]
# -- Serde
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3" }

# -- Data
sqlx = { version = "0.8", features = ["macros", "runtime-tokio", "sqlite", "uuid", "chrono"] }
strum = "0.27"
strum_macros = "0.27"

# -- Others
thiserror = "2"
color-eyre = "0.6"

# -- Web
tokio = { version = "1", features = ["full"] }
tower-cookies = "0.11"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
